data_replace_warning:
  order: 1111
  vi: Dữ liệu hiện tại sẽ được thay thế, không gộp hai khu vườn. Một bản an toàn được lưu trên thiết bị trước khi thay. Cây đã chết có thể trở lại trạng thái cũ nếu bản sao có trước thời điểm đó.
  en: Current data will be replaced, without merging gardens. A local safety copy is saved first. A dead tree may return to an earlier state if the backup predates its death.
  canonical: false
  source: app/src/debug/java/com/mamxanh/app/presentation/ui/DataSettingsScreen.kt
