data_privacy:
  order: 1123
  vi: Không cần tài khoản. Dữ liệu chơi chính lưu trên thiết bị; tệp sao lưu do bạn chọn nơi lưu. Thông báo là tùy chọn. Bản an toàn cục bộ có thể chứa lịch sử; gỡ ứng dụng sẽ xóa bản này.
  en: No account required. Primary gameplay data stays on this device; you choose where backup files are saved. Notifications are optional. The local safety copy may contain history and is removed on uninstall.
  canonical: false
  source: app/src/debug/java/com/mamxanh/app/presentation/ui/DataSettingsScreen.kt
data_policy:
  order: 1124
  vi: Ngày mới tính theo giờ địa phương; cây giữ múi giờ lúc gieo. Tiến độ cây hiển thị phần trăm. Không có âm thanh đang phát; giảm chuyển động trong Tùy chọn.
  en: Days reset in local time; trees retain their planting timezone. Tree progress uses percentages. No sound is currently played; reduced motion is available in Settings.
  canonical: false
  source: app/src/debug/java/com/mamxanh/app/presentation/ui/DataSettingsScreen.kt
data_accessibility:
  order: 1125
  vi: Cỡ chữ dùng thiết lập hệ thống. Nút có vùng chạm tối thiểu 48 dp; trạng thái có chữ và biểu tượng.
  en: Text size follows system settings. Controls retain at least 48 dp touch targets; states include text and icons.
  canonical: false
  source: app/src/debug/java/com/mamxanh/app/presentation/ui/DataSettingsScreen.kt
