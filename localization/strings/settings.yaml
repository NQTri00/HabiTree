  canonical: false
  source: app/src/debug/java/com/mamxanh/app/presentation/ui/DataSettingsScreen.kt
data_safety_note:
  order: 1130
  vi: Khôi phục bản an toàn sẽ thay dữ liệu hiện tại. Hãy xuất bản sao hiện tại trước nếu muốn giữ cả hai.
  en: Recovering the safety copy replaces current data. Export current data first to keep both.
  canonical: false
  source: app/src/debug/java/com/mamxanh/app/presentation/ui/DataSettingsScreen.kt
