name: KMP native CI

on:
  push:
    paths:
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/kmp-native-ci.yml"
  pull_request:
    paths:
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/kmp-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frameworks:
    name: Link iOS device and simulator frameworks
    # Intel macOS can link both arm64 targets; avoid the saturated hosted arm64 queue.
    runs-on: macos-26-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17 launcher
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify selected Xcode and SDK
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Compile and link both native frameworks
        run: bash ./gradlew --no-daemon :shared:linkDebugFrameworkIosArm64 :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Archive frameworks preserving symbolic links
        run: tar -czf mamxanh-ios-frameworks.tar.gz -C shared/build/bin iosArm64/debugFramework/MamXanhShared.framework iosSimulatorArm64/debugFramework/MamXanhShared.framework

      - name: Upload native frameworks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mam-xanh-ios-frameworks
          path: mamxanh-ios-frameworks.tar.gz
          if-no-files-found: error
          retention-days: 7
