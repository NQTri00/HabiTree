name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android and shared metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17 launcher
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify dependency ownership and patch whitespace
        run: |
          git show --format= --check HEAD
          bash ./gradlew --no-daemon verifyArchitecture

      # The wrapper supports the Java 25 daemon selected by gradle-daemon-jvm.properties.
      - name: Build both APKs and shared metadata with the repository wrapper
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleVerification :app:lintDebug :shared:compileCommonMainKotlinMetadata --stacktrace

      - name: Enable KVM for SQLite regression tests
        run: |
          sudo chmod 666 /dev/kvm

      - name: Run SQLite gameplay, migrations and backup tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash ./gradlew --no-daemon :data:connectedDebugAndroidTest

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mam-xanh-verification-reports
          path: |
            data/build/reports/androidTests/
            data/build/outputs/androidTest-results/
            **/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mam-xanh-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/verification/app-verification.apk
          if-no-files-found: error
          retention-days: 7
