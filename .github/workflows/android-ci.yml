name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      render_previews:
        description: Render all tracked Compose screenshots on the runner
        type: boolean
        default: false
      verify_standalone:
        description: Publish Android libraries to temporary Maven storage and build isolated consumers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android and shared metadata
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.render_previews || inputs.verify_standalone) && 60 || 30 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up JDK 17 launcher
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify dependency ownership and patch whitespace
        run: |
          git show --format= --check HEAD
          bash ./gradlew --no-daemon verifyArchitecture

      # The wrapper supports the Java 25 daemon selected by gradle-daemon-jvm.properties.
      - name: Test feature routing and build both APKs and shared metadata
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :core-utils:test :stats:data:testDebugUnitTest :app:assembleDebug :app:assembleVerification :app:lintDebug :shared:compileCommonMainKotlinMetadata --stacktrace

      - name: Enable KVM for SQLite regression tests
        run: |
          sudo chmod 666 /dev/kvm

      - name: Run SQLite and installed-app navigation tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: >-
            bash tools/android/verify-installed-debug.sh app/build/outputs/apk/debug/app-debug.apk app/build/reports/installed-debug.txt
            && bash ./gradlew --no-daemon :core-storage:connectedDebugAndroidTest :app:connectedVerificationAndroidTest

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mam-xanh-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/installed-debug.txt
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            core-utils/build/test-results/
            stats/data/build/test-results/
            data/build/reports/androidTests/
            data/build/outputs/androidTest-results/
            **/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mam-xanh-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/verification/app-verification.apk
          if-no-files-found: error
          retention-days: 7

      - name: Render Compose preview evidence
        if: inputs.render_previews
        run: |
          cli="$RUNNER_TEMP/android-preview"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$cli" https://dl.google.com/android/cli/latest/linux_x86_64/android
          chmod +x "$cli"
          "$cli" --version
          python3 -B tools/android/render_previews.py --cli "$cli" --sdk "$ANDROID_HOME" \
            --output "$RUNNER_TEMP/habitree-compose"

      - name: Upload Compose preview evidence
        if: always() && inputs.render_previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: habitree-compose-previews
          path: ${{ runner.temp }}/habitree-compose/
          if-no-files-found: error
          retention-days: 7

      - name: Verify independently exported Android projects
        if: inputs.verify_standalone
        run: bash tools/android/verify_standalone.sh "$RUNNER_TEMP/habitree-standalone"

      - name: Upload standalone Android Maven artifacts
        if: inputs.verify_standalone
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: habitree-standalone-android-maven
          path: |
            ${{ runner.temp }}/habitree-standalone/maven/
            ${{ runner.temp }}/habitree-standalone/source-revision.txt
            ${{ runner.temp }}/habitree-standalone/MAVEN-SHA256SUMS.txt
            ${{ runner.temp }}/habitree-standalone/app/app/build/test-results/
          if-no-files-found: error
          retention-days: 7
